{% set name = "plac" %}
{% set version = "1.4.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 86a50abd40c5a6ea9695b45a1f08637e744e0a57249c24d1593cad9eda1f8aac

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python

test:
  source_files:
    - doc/test_plac.py
  imports:
    - plac
    - plac_core
    - plac_ext
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest doc/test_plac.py -v -k "not test_doctest"

about:
  home: https://github.com/ialbert/plac
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: The smartest command line arguments parser in the world
  description: |
    plac is a Python package that can generate command line parameters from function signatures
    plac works on Python 2.6 through all versions of Python 3
  doc_url: https://plac.readthedocs.io
  dev_url: https://github.com/ialbert/plac

extra:
  recipe-maintainers:
    - pmlandwehr
